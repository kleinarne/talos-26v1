# Secret scanning per ADR-002: public-repo hygiene enforced by
# tooling, not discipline.
name: gitleaks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    # ubuntu-latest migrates to 26.04 from 2026-10-19 (actions/runner-images#14748);
    # pin 24.04 until the new image is validated.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret in an old commit is still a leak.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
