---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 15m
  chart:
    spec:
      chart: paperless-ngx
      version: 15.13.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    global:
      stopAll: false
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 3Gi
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PAPERLESS_CONSUMER_POLLING_INTERVAL: 10
                PAPERLESS_CONSUMER_STABILITY_DELAY: 5
                PAPERLESS_URL: https://paperless.${DOMAIN_0}
                PAPERLESS_OCR_LANGUAGE: "eng"
                PAPERLESS_OCR_LANGUAGES: "eng deu"
                # Native AI -> erazer Ollama (interim backend; standing-vs-interim open in local-ai brief)
                # gemma4:e4b: non-thinking generation model. Thinking models are unusable for
                # suggestions: paperless's think:false is dropped by llama-index-llms-ollama
                # (False or None -> None) - paperless-ngx #14383, discussion #14111.
                PAPERLESS_AI_ENABLED: "true"
                PAPERLESS_AI_LLM_BACKEND: "ollama"
                PAPERLESS_AI_LLM_ENDPOINT: "http://${ERAZER_IP}:11434"
                PAPERLESS_AI_LLM_MODEL: "gemma4:e4b"
                PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: "Deutsch"
                PAPERLESS_AI_LLM_EMBEDDING_BACKEND: "ollama"
                PAPERLESS_AI_LLM_EMBEDDING_MODEL: "embeddinggemma"
                PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "900"
                PAPERLESS_TASK_WORKERS: "2"
                PAPERLESS_LLM_INDEX_TASK_CRON: "0 21 * * *"
                # Trusted-header SSO (homelab-hardening item 5): consumes the
                # Remote-User header injected by the forward-auth gate below,
                # enabled in the SAME change (ordering rule from the brief).
                # GOTCHA: Remote-User must match the existing paperless username
                # - Django's remote-user backend auto-creates a non-admin user
                # otherwise. PAPERLESS_ENABLE_HTTP_REMOTE_USER_API deliberately
                # NOT set: token clients (mobile app) get bounced by the
                # forward-auth gate at the edge anyway; ingest path = NFS
                # consume dir, unaffected.
                PAPERLESS_ENABLE_HTTP_REMOTE_USER: "true"
    cnpg:
      main:
        mode: recovery
        password: ${PAPERLESS_CNPG_PASSWORD}
        cluster:
          instances: 1
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
        backups:
          enabled: true
          credentials: garage
          scheduledBackups:
            - name: daily-backup
              schedule: "0 46 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          enabled: true
          credentials: garage
    persistence:
      data:
        volsync:
          - name: backup
            type: restic
            credentials: garage
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 48 0 * * *
      media:
#        type: nfs
#        server: ${TRUENAS_IP}
#        path: ${PAPERLESS_NFS_PATH}
        volsync:
          - name: backup
            type: restic
            credentials: garage
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 50 0 * * *
      consume:
        type: nfs
        server: ${TRUENAS_IP}
        path: ${PAPERLESS_WATCHDIR_NFS_PATH}
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        annotations:
          cert-manager.io/cluster-issuer: domain-0-le-prod
          # Authelia forward-auth gate (homelab-hardening item 5) — house
          # pattern (headlamp/chat.${DOMAIN_0}): in-cluster verify, GET
          # method, response headers; $$ = render-verified literal form
          # (broker-args precedent, PR #178). Enabled together with
          # PAPERLESS_ENABLE_HTTP_REMOTE_USER above (ordering rule: header
          # auth only ever with the gate, same change).
          nginx.ingress.kubernetes.io/auth-method: 'GET'
          nginx.ingress.kubernetes.io/auth-url: 'http://authelia.authelia.svc.cluster.local:9091/api/verify'
          nginx.ingress.kubernetes.io/auth-signin: 'https://auth.${DOMAIN_0}?rm=$$request_method'
          nginx.ingress.kubernetes.io/auth-response-headers: 'Remote-User,Remote-Name,Remote-Groups,Remote-Email'
        hosts:
          - host: paperless.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    credentials:
      garage:
        type: s3
        url: ${GARAGE_S3_URL}
        bucket: ${GARAGE_S3_BUCKET}
        accessKey: ${GARAGE_S3_ACCESSKEY}
        secretKey: ${GARAGE_S3_SECRETKEY}
        encrKey: ${GARAGE_S3_ENCRYPTIONKEY}
