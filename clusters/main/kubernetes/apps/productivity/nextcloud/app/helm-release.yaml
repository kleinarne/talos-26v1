---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 15m
  chart:
    spec:
      chart: nextcloud
      version: 46.10.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    global:
      stopAll: false
    nextcloud:
      general:
        run_optimize: true
        default_phone_region: DE
        accessIP: ${NGINX_INTERNAL_IP}
      collabora:
        enabled: true
        username: ${NEXTCLOUD_COLLABORA_USERNAME}
        password: ${NEXTCLOUD_COLLABORA_PASSWORD}
        dictionaries:
          - de_DE
          - en_GB
          - en_US
    cnpg:
      main:
        mode: recovery
        password: ${NEXTCLOUD_CNPG_PASSWORD}
        backups:
          enabled: true
          credentials: garage
          scheduledBackups:
            - name: daily-backup
              schedule: "0 38 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          enabled: true
          credentials: garage
    persistence:
      config:
        volsync:
          - name: backup
            type: restic
            credentials: garage
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 41 0 * * *
      data:
        type: nfs
        server: ${TRUENAS_IP}
        path: ${NEXTCLOUD_NFS_PATH}
      html:
        volsync:
          - name: backup
            type: restic
            credentials: garage
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 43 0 * * *
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: nextcloud.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    credentials:
      garage:
        type: s3
        url: ${GARAGE_S3_URL}
        bucket: ${GARAGE_S3_BUCKET}
        accessKey: ${GARAGE_S3_ACCESSKEY}
        secretKey: ${GARAGE_S3_SECRETKEY}
        encrKey: ${GARAGE_S3_ENCRYPTIONKEY}
