apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - inputName: DS_LOKI
      datasourceName: loki
  grafanaCom:
    id: 17821
    revision: 4
  folder: "Infrastructure ⚙️"