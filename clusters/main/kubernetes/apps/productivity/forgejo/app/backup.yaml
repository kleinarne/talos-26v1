---
# Restic repository credentials for the Forgejo PVC backup
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-backup-restic
  namespace: forgejo
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:${GARAGE_S3_URL}/${GARAGE_S3_BUCKET}/forgejo
  RESTIC_PASSWORD: ${GARAGE_S3_ENCRYPTIONKEY}
  AWS_ACCESS_KEY_ID: ${GARAGE_S3_ACCESSKEY}
  AWS_SECRET_ACCESS_KEY: ${GARAGE_S3_SECRETKEY}
---
# Nightly restic backup of the Forgejo data PVC to Garage S3
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: forgejo
  namespace: forgejo
spec:
  # The official forgejo chart inherits the upstream gitea chart's naming:
  # the data PVC is <release>-shared-storage, NOT forgejo-shared.
  # Verified 2026-10-11: kubectl get pvc -n forgejo -> gitea-shared-storage
  sourcePVC: gitea-shared-storage
  trigger:
    # TEMPORARY one-shot fire time (2026-10-12T04:56Z UTC) to accelerate
    # the drill-2 content backup. Revert to "7 1 * * *" as soon as the
    # accelerated sync completes — next cron occurrence after today is
    # 2027, so the nightly is silently OFF until reverted.
    schedule: "56 4 12 10 *"
  restic:
    copyMethod: Snapshot
    repository: forgejo-backup-restic
    retain:
      hourly: 0
      daily: 7
      weekly: 5
      monthly: 12
      yearly: 0
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn-snapshot-vsc
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
