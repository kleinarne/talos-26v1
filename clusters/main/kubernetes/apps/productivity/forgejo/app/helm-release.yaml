---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 15m
  chart:
    spec:
      chart: forgejo
      version: 17.3.1
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # App version pin: chart 17.3.1's default appVersion lags the app
    # (15.0.10, v15 is past its support window). Moving the app via
    # image.tag is the chart-sanctioned way; image.rootless (default
    # true) appends the variant suffix, rendering
    # code.forgejo.org/forgejo/forgejo:16.0.6-rootless.
    # Hop 1 of the 15 -> 16 -> 17 upgrade (v17 is gated on the
    # leading-slash link rendering in the vault). 17.0.0 is
    # blacklisted: upstream #14866 writes an empty receive.hideRefs on
    # upgrade, breaking every push/web-merge; fix staged in 17.0.1 —
    # target that, never 17.0.0.
    image:
      tag: "16.0.6"
    strategy:
      type: Recreate
    persistence:
      enabled: true
      size: 10Gi
    # Pin the forgejo-http ClusterIP: the Talos machine-config registry mirror
    # (talconfig inline patch, PR companion) points at this IP, and unpinned a
    # recreated Service gets a new ClusterIP, silently breaking node-level
    # image pulls. Rendered from clusterenv via the usual var substitution.
    service:
      http:
        clusterIP: ${FORGEJO_CLUSTERIP}
    gitea:
      admin:
        existingSecret: forgejo-admin-secret
      config:
        server:
          DOMAIN: git.${DOMAIN_0}
          ROOT_URL: https://git.${DOMAIN_0}/
          # Advertised SSH endpoint in clone URLs. Port 22 is TCP-proxied by
          # nginx-external (values.tcp) to the forgejo-ssh service.
          # Reachable on LAN/WireGuard only; no WAN port-forward exists.
          SSH_DOMAIN: git.${DOMAIN_0}
          SSH_PORT: 22
        database:
          DB_TYPE: sqlite3
        service:
          DISABLE_REGISTRATION: true
        mailer:
          ENABLED: true
          SMTP_ADDR: ${SCALEWAY_SERVER}
          SMTP_PORT: 465
          FROM: ${SCALEWAY_SENDER_EMAIL}
          USER: ${SCALEWAY_USERNAME}
          PASSWD: ${SCALEWAY_PASSWORD}
    ingress:
      enabled: true
      className: external
      annotations:
        cert-manager.io/cluster-issuer: domain-0-le-prod
      hosts:
        - host: git.${DOMAIN_0}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: forgejo-tls
          hosts:
            - git.${DOMAIN_0}
