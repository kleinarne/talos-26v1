---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: qbittorrent
      version: 25.11.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    global:
      stopAll: false
    persistence:
      config:
        volsync:
          - name: backup
            type: restic
            credentials: garage
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 1 0 * * *
      media:
        enabled: true
        existingClaim: media-nfs-pvc
        mountPath: /mnt/media
      webui:
        enabled: true
        type: nfs
        server: ${TRUENAS_IP}
        path: ${VUETORRENT_WEBUI_NFS_PATH}
        mountPath: /webui
    service:
      torrent:
        type: LoadBalancer
        loadBalancerIP: ${QBITTORRENT_IP}
        integrations:
          metallb:
            enabled: true
        ports:
          torrent:
            port: 51482
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: qbittorrent.${DOMAIN_0}
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    credentials:
      garage:
        type: s3
        url: ${GARAGE_S3_URL}
        bucket: ${GARAGE_S3_BUCKET}
        accessKey: ${GARAGE_S3_ACCESSKEY}
        secretKey: ${GARAGE_S3_SECRETKEY}
        encrKey: ${GARAGE_S3_ENCRYPTIONKEY}
