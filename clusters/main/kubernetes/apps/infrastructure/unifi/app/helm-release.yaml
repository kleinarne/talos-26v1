---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
  namespace: unifi
spec:
  interval: 15m
  chart:
    spec:
      chart: unifi
      version: 27.1.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    global:
      stopAll: false
    persistence:
      data:
        volsync:
          # DR restore coverage (2026-11-12 audit): dest enabled for the
          # restore window (restore-then-start). Window-only: a dest applied
          # against the live cluster fires an in-place restore over prod data.
          # The 2026-09-14 restore-day leftover (garage-recovery credentials,
          # `-redir` bucket) is dropped -- the house pattern restores from
          # the regular garage bucket.
          - name: backup
            type: restic
            credentials: garage
            dest:
              enabled: true
            # Window guard (2026-11-12 ruling, applied 2026-11-14): writer
            # off in the recovery position -- TC volsync values expose no
            # pause switch, so disable the source entirely until the
            # restore is verified (the steady-state motion re-enables it).
            # The rendered TC source is schedule-triggered (no fire at
            # creation -- verified from the TC common template), so this
            # is belt-and-braces, not an empty-snapshot patch.
            src:
              enabled: false
              trigger:
                schedule: 32 0 * * *
    service:
      comm:
        type: LoadBalancer
        loadBalancerIP: ${UNIFI_IP}
        integrations:
          metallb:
            enabled: true
      stun:
        type: LoadBalancer
        loadBalancerIP: ${UNIFI_IP}
        integrations:
          metallb:
            enabled: true
      speedtest:
        type: LoadBalancer
        loadBalancerIP: ${UNIFI_IP}
        integrations:
          metallb:
            enabled: true
      guestportal:
        type: LoadBalancer
        loadBalancerIP: ${UNIFI_IP}
        integrations:
          metallb:
            enabled: true
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
        hosts:
          - host: unifi.${DOMAIN_0}
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    credentials:
      garage:
        type: s3
        url: ${GARAGE_S3_URL}
        bucket: ${GARAGE_S3_BUCKET}
        accessKey: ${GARAGE_S3_ACCESSKEY}
        secretKey: ${GARAGE_S3_SECRETKEY}
        encrKey: ${GARAGE_S3_ENCRYPTIONKEY}