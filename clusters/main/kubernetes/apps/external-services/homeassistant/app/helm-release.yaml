---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: es-homeassistant
  namespace: external-services
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 17.11.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    service:
      main:
        enabled: true
        type: ExternalIP
        externalIP: ${HOMEASSISTANT_IP}
        ports:
          main:
            enabled: true
            port: 8123
            protocol: http
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: homeassistant.${DOMAIN_0}