---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 15m
  chart:
    spec:
      chart: authelia
      version: 32.19.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    global:
      stopAll: false
    authelia:
      session:
        cookies:
          - domain: ${DOMAIN_0}
            authelia_url: https://auth.${DOMAIN_0}
      authentication_backend:
        ldap:
          implementation: lldap
          address: ldap://lldap-ldap.lldap.svc.cluster.local:3890
          base_dn: dc=arneklein,dc=net
          user: uid=manager,ou=people,dc=arneklein,dc=net
          password: ${AUTHELIA_LDAP_BIND_PASSWORD}
      identity_providers:
        oidc:
          enabled: true
          clients:
            - id: ${PAPERLESS_OIDC_CLIENT_ID}
              description: Paperless-ngx OIDC Client
              secret: ${PAPERLESS_OIDC_CLIENT_SECRET}
              public: false
              authorization_policy: one_factor
              redirect_uris:
                - https://paperless.${DOMAIN_0}/accounts/oauth2/login/callback/
              scopes:
                - openid
                - profile
                - email
                - groups
              userinfo_signing_algorithm: none
      notifier:
        smtp:
          address: smtp://${SCALEWAY_SERVER}:587
          username: ${SCALEWAY_USERNAME}
          password: ${SCALEWAY_PASSWORD}
          sender: ${SCALEWAY_SENDER_EMAIL}
          tls:
            server_name: ${SCALEWAY_SERVER}
            minimum_version: TLS1.2
      access_control:
        default_policy: deny
        rules:
          - domain:
              - '*.${DOMAIN_0}'
              - ${DOMAIN_0}
            policy: one_factor
            subject:
              - group:admin
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION}
                AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_RESET}
                AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE}
                AUTHELIA_OIDC_PRIVATE_KEY: ${AUTHELIA_OIDC_PRIVATE_KEY}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: auth.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    cnpg:
      main:
        enabled: true
        backups:
          enabled: true
          credentials: garage
          scheduledBackups:
            - name: daily-backup
              schedule: "0 1 1 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          enabled: false
    redis:
      enabled: true
    credentials:
      garage:
        type: s3
        url: ${GARAGE_S3_URL}
        bucket: ${GARAGE_S3_BUCKET}
        accessKey: ${GARAGE_S3_ACCESSKEY}
        secretKey: ${GARAGE_S3_SECRETKEY}
        encrKey: ${GARAGE_S3_ENCRYPTIONKEY}