---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 15m
  chart:
    spec:
      chart: authelia
      version: 32.19.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin

    global: # stopAll
      stopAll: false

    workload: # Replicas, Environment Variables
      main:
        replicas: 1
        podSpec:
          containers:
            main:
              env:
                AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION}
                AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_RESET}
                AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE}

    persistence:
      config:
        volsync:
          - name: backup
            type: restic
            credentials: garage
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 10 1 * * *
      configfile:
        enabled: true
        type: configmap
        objectName: authelia-configfile
        expandObjectName: false
        mountPath: /configuration.yaml
        subPath: configuration.yaml
        readOnly: true
      secrets:
        enabled: true
        type: secret
        objectName: authelia-oidc-secret
        expandObjectName: false
        mountPath: /config/secret
        readOnly: true

    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: auth.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true

    cnpg:
      main:
        enabled: true
        backups:
          enabled: true
          credentials: garage
          scheduledBackups:
            - name: daily-backup
              schedule: "0 1 1 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          enabled: false

    redis:
      enabled: true

    credentials:
      garage:
        type: s3
        url: ${GARAGE_S3_URL}
        bucket: ${GARAGE_S3_BUCKET}
        accessKey: ${GARAGE_S3_ACCESSKEY}
        secretKey: ${GARAGE_S3_SECRETKEY}
        encrKey: ${GARAGE_S3_ENCRYPTIONKEY}