# Readiness gate for the broker READ container (2026-10-31 review
# finding: /docs only proves the mcpo wrapper listens; on a fresh PVC
# kubelet CREATES missing subPath dirs, so an EMPTY vault mirror was
# served Ready and silent). The exec probe runs this script with
# READYZ_REPO=/vault: the read mirror must be a git worktree with a
# commit checked out on HEAD - i.e. the vault-sync bootstrap clone ran.
#
# NOT used on the stage-glue (write) container: its clone is created
# lazily by the first park, so a data-based gate there would deadlock
# the write path after a fresh PVC (PR review 2026-11-01: glue NotReady
# drops the pod from the service on BOTH ports, the first park never
# arrives, the clone is never created). The glue keeps httpGet /docs.
#
# Zero new dependencies: python3 + subprocess to git are in the image.
# FAILS LOUD: an empty or missing mirror keeps the read container
# NotReady - the documented manual vault-sync bootstrap job is the
# repair. Failures are TRUTHFUL: a nonzero git exit always surfaces the
# exit code + stderr tail (2026-11-01 defect: root-ownership 'dubious
# ownership' was misreported as 'no commit checked out'). Ownership
# itself cannot be corrected in-band: the ns enforces PodSecurity
# restricted:latest (the #305 root initContainer was admission-
# rejected), so this probe declares git's path-scoped trust
# (safe.directory via GIT_CONFIG_GLOBAL, see the script body) for the
# kubelet root-uid subPath pattern.
apiVersion: v1
kind: ConfigMap
metadata:
  name: broker-readyz
  namespace: broker
data:
  readyz.py: |
    import os
    import subprocess
    import sys

    path = os.environ.get("READYZ_REPO", "/vault")

    # Kubelet creates missing subPath dirs at pod mount with ROOT uid
    # (fsGroup fixes only the gid) and this ns enforces PodSecurity
    # restricted:latest, so no root container can chown it back in-band.
    # safe.directory is git's designed, path-scoped trust declaration for
    # exactly this kubelet pattern - but git only honors it from a GLOBAL
    # or SYSTEM config (never -c: a hostile repo must not be able to
    # self-declare trust). The env-config pattern is already idiomatic in
    # the stage glue (42). The probe writes to /tmp (pod-ephemeral,
    # emptyDir) and passes GIT_CONFIG_GLOBAL only to the rev-parse child;
    # the broker container's own env is untouched. No-op when the mirror
    # is already uid-1000 (sync-first convergence).
    gitconfig = os.path.join(
        os.environ.get("READYZ_TMP", "/tmp"), "readyz.gitconfig"
    )
    with open(gitconfig, "w", encoding="utf-8") as fh:
        fh.write("[safe]\n\tdirectory = " + path + "\n")
    probe_env = dict(os.environ)
    probe_env["GIT_CONFIG_GLOBAL"] = gitconfig

    def fail(reason):
        print("readyz: NOT READY - " + reason, file=sys.stderr, flush=True)
        sys.exit(1)

    if not os.path.isdir(os.path.join(path, ".git")):
        fail("no git repository at " + path + " - run the vault-sync bootstrap job")
    try:
        head = subprocess.run(
            ["git", "-C", path, "rev-parse", "--verify", "HEAD"],
            capture_output=True,
            text=True,
            timeout=10,
            env=probe_env,
        )
    except OSError as err:
        fail("git invocation failed: " + str(err))
    except subprocess.TimeoutExpired:
        fail("git rev-parse timed out")
    if head.returncode != 0 or not head.stdout.strip():
        # Truthful failure (2026-11-01 live reinstall defect: a root-owned
        # mirror - kubelet creates missing subPath dirs as root - made
        # rev-parse die 'dubious ownership' and this probe reported 'no
        # commit checked out' while the commit existed). The git exit code
        # and stderr tail must always reach the failure message.
        detail = head.stderr.strip().replace("\n", " | ")[-300:]
        if head.returncode != 0:
            fail(
                "git rev-parse failed at " + path
                + " (git exit " + str(head.returncode) + "): " + detail
            )
        fail("no commit checked out at " + path)
    print("readyz: OK - " + path + " at " + head.stdout.strip()[:12])
    sys.exit(0)
