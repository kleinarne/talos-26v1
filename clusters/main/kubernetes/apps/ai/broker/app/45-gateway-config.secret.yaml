# agentgateway config for the MCP front (50-gateway-deployment.yaml).
#
# Shipped as a WHOLE-FILE sops-encrypted Secret, not just the two API
# keys: keyHash support for the MCP apiKey policy is unconfirmed in the
# v1.7 docs, so the entire config.yaml is treated as secret material -
# the keys never appear in git history in any recoverable form.
# PRE-MERGE manual step (see the PR): replace the two __SOPS_REPLACE_*__
# placeholders with generated keys, then
#   sops --encrypt --in-place 45-gateway-config.secret.yaml
# and commit the encrypted file to the PR branch. Merged as-is, the
# placeholders are inert: strictly-mode auth with unguessable keys
# nobody holds - the gateway starts, it just serves no one.
#
# Envsubst: Flux strict post-build envsubst parses every dollar in the
# rendered set, and sops decryption happens BEFORE substitution - so a
# dollar inside this (decrypted) Secret would be substituted too. This
# config is deliberately ZERO-DOLLAR: no agentgateway env-expansion
# references, hardcoded values only.
#
# Auth model: apiKey strict, two keys carrying role metadata. The
# mcpAuthorization rules are a CEL ALLOW-LIST evaluated default-deny:
# an unevaluable rule is FALSE (fail-closed), and tools a key may not
# call are filtered OUT of its tools/list response - invisible, not
# merely refused. Tool names in rules are the agentgateway-multiplexed
# prefixed names (<target>_<tool>).
apiVersion: v1
kind: Secret
metadata:
  name: gateway-config
  namespace: broker
type: Opaque
stringData:
  config.yaml: |
    config:
      database:
        url: sqlite:////data/data.db
    mcp:
      port: 3000
      policies:
        cors:
          allowOrigins: ["*"]
          allowHeaders:
            - mcp-protocol-version
            - content-type
            - cache-control
            - mcp-session-id
          exposeHeaders: ["Mcp-Session-Id"]
        apiKey:
          mode: strict
          keys:
            - key: __SOPS_REPLACE_DESK_KEY__
              metadata:
                role: desk
            - key: __SOPS_REPLACE_CONNECTOR_KEY__
              metadata:
                role: connector
        mcpAuthorization:
          rules:
            # desk: everything both targets expose (all vault tools +
            # park). Matches current desk usage, where the two mcpo
            # endpoints are toggled per chat.
            - 'apiKey.role == "desk"'
            # connector: vault READ tools only. The RO mount would fail
            # the edit tools at the filesystem anyway; this keeps them
            # invisible instead of merely broken. Explicit ALLOW-list,
            # not a deny-list: a tool added upstream later stays denied
            # to the connector until deliberately listed here.
            - 'apiKey.role == "connector" && mcp.tool.name in ["vault_audit_links", "vault_get_backlinks", "vault_get_category", "vault_get_note_neighborhood", "vault_get_note_outline", "vault_get_note_stats", "vault_get_note_structure", "vault_get_outlinks", "vault_get_tag", "vault_list_categories", "vault_list_notes", "vault_list_tags", "vault_query_frontmatter", "vault_read_note", "vault_resolve_ref", "vault_search_regex", "vault_search_text"]'
            # connector: park - the single broker write motion. park
            # itself never merges and never pushes main (glue contract,
            # 42); this rule keeps it the ONLY connector-reachable
            # write.
            - 'apiKey.role == "connector" && mcp.tool.name == "park_park"'
      targets:
        - name: vault
          stdio:
            cmd: obsidian-vault-mcp
            args: ["--log-level", "info", "--vault", "/vault", "serve"]
            env:
              # Set explicitly in case agentgateway replaces (rather
              # than merges) the child environment - the subprocess must
              # always be able to resolve its own children. HOME=/tmp
              # mirrors the broker containers (pod-ephemeral, nothing
              # lands on the PVC).
              PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
              HOME: /tmp
        - name: park
          stdio:
            cmd: python
            args: ["/glue/stage_server.py"]
            env:
              PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
              HOME: /tmp
              # Own staging subtree on the shared RW staging subPath:
              # clone at /staging/ag/vault-write, lock at
              # /staging/ag/.stage.lock - fully disjoint from the
              # broker sidecar's /staging/vault-write and /.stage.lock.
              # No shared state; both write paths stay independent.
              # VAULT_OWNER/VAULT_REPO/FORGEJO_URL etc. are NOT set
              # here: the glue defaults (42) already match the values
              # the broker sidecar receives via postBuild substitution;
              # keeping this config zero-dollar beats restating them.
              STAGING_DIR: /staging/ag
