# agentgateway config for the MCP front (50-gateway-deployment.yaml).
#
# Shipped as a WHOLE-FILE sops-encrypted Secret, not just the API keys:
# keyHash support for the MCP apiKey policy is unconfirmed in the v1.7
# docs, so the entire config.yaml is treated as secret material - the
# keys never appear in git history in any recoverable form.
# PRE-MERGE manual step (see the PR): replace the three __SOPS_REPLACE_*__
# placeholders with generated values (two API keys, one session key),
# then sops --encrypt --in-place 45-gateway-config.secret.yaml and
# commit the encrypted file to the PR branch. Merged as-is, the
# placeholders are inert: strictly-mode auth with unguessable keys
# nobody holds - the gateway starts, it just serves no one.
#
# Envsubst: Flux strict post-build envsubst parses every dollar in the
# rendered set, and sops decryption happens BEFORE substitution - so a
# dollar inside this (decrypted) Secret would be substituted too. This
# config is deliberately ZERO-DOLLAR: no agentgateway env-expansion
# references, hardcoded values only.
#
# Auth model: apiKey strict, two keys carrying role metadata. The
# mcpAuthorization rules are a CEL ALLOW-LIST evaluated default-deny:
# an unevaluable rule is FALSE (fail-closed), and tools a key may not
# call are filtered OUT of its tools/list response - invisible, not
# merely refused. Tool names in rules are the agentgateway-multiplexed
# prefixed names (<target>_<tool>).
#
# Runtime-verified facts baked into this file (2026-11-02, live probe
# against the v0.1.0 image with the v1.7.0 release binary):
# - agentgateway MERGES the child env with the map (parent vars
#   survive), but map values OVERRIDE, and cmd resolution uses the
#   child PATH - so the map PATH below is authoritative and must match
#   the image. The broker-mcp image layout is: venv at /opt/venv
#   (python, MCP SDK), obsidian-vault-mcp at /usr/local/bin, git at
#   /usr/bin. cmd values are absolute paths on top of that, so spawn
#   does not depend on PATH resolution at all.
# - v1.7 always encrypts MCP session IDs; with a read-only config file
#   it cannot persist a generated key (warns, runs unencrypted). The
#   session key below pins it: encrypted sessions, stable across pod
#   restarts.
