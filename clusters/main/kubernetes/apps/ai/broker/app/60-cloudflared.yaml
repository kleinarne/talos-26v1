# 60-cloudflared.yaml — WAN leg of the Vibe-to-broker endpoint (ADR-010).
# Remotely-managed tunnel (ruling 2026-11-03): the ingress mapping
#   mcp.arneklein.net -> http://gateway-svc.broker.svc.cluster.local:3000
# lives in the Cloudflare dashboard, OUT of git custody — recorded as topology
# inventory in the ADR-010 acceptance (same custody status as the API keys).
# STAGED (ruling 2026-11-04): NOT in kustomization.yaml resources until the
# real tunnel token exists — a placeholder token would CrashLoopBackOff.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: broker
  labels:
    app: cloudflared
spec:
  replicas: 2   # two connectors: tunnel survives one pod eviction (CF-supported)
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
      containers:
        - name: cloudflared
          # digest proven on this cluster (truecharts cloudflared-17.0.10 fleet, same image)
          image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          args: ["tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            # mirrored from the proven truecharts pod (same digest, 50d runtime)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
