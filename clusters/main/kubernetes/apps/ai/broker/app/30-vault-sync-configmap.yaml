# Mirror refresh of Core main for the broker read port (:8000).
# Refactor (2026-10-31 live diagnosis of the pre-refactor clone):
# - auth is per invocation (http.extraHeader); the old script baked the
#   token into the clone-time URL, so every later pull silently relied on
#   a credential baked at clone time and broke on rotation (and the
#   mounted secret was never consulted).
# - the remote is re-pointed to the clean URL every run; the old remote
#   was whatever clone time recorded (rename/redirect hazard).
# - divergence stays a LOUD ff-only error. The mirror is disposable;
#   wipe + reclone (namespace delete, fresh PVC) is the designed repair,
#   never a silent reset.
# NOTE: every shell dollar below is doubled. Flux post-build envsubst
# (strict) runs over this ConfigMap and would otherwise parse the
# script's variables as its own substitution variables and fail the
# build. The rendered output carries single dollars. VAULT_OWNER/
# VAULT_REPO come from the CronJob env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-sync-script
  namespace: broker
data:
  sync.sh: |
    #!/bin/sh
    set -eu
    # Single-writer lock: concurrencyPolicy: Forbid only serializes jobs
    # the CronJob controller creates; a manual bootstrap job (kubectl
    # create job --from=cronjob/vault-sync) is NOT covered by it and could
    # race a scheduled run - two clones or two ff-merges on the same PVC
    # worktree. The lock file on the PVC closes that gap (both paths run
    # this script; busybox flock holds it for the shell via fd 9).
    exec 9>/data/.sync.lock
    flock 9
    # Kubelet creates missing subPath dirs at broker-pod mount with ROOT
    # uid (fsGroup fixes only the gid); the ns enforces PodSecurity
    # restricted:latest, so no root container can chown it back in-band.
    # safe.directory is git's designed, path-scoped trust declaration for
    # exactly this kubelet pattern. CRITICAL: git only honors it from a
    # SYSTEM or GLOBAL config - via -c and via repo config it is IGNORED
    # (deliberate: a hostile repo must not be able to self-declare trust).
    # Plain set (not --add) = idempotent; HOME=/tmp is pod-ephemeral, so
    # no config file ever lands on the PVC. No-op when the dir is already
    # uid-1000 (sync-first convergence).
    git config --global safe.directory /data/vault
    TOKEN="$$(cat /secrets/forgejo-token)"
    # HTTPS over the in-cluster path (git.<domain> pinned to the
    # nginx-internal LB VIP by the job's hostAliases; nginx-internal
    # serves the *.<domain> wildcard LE cert, so TLS validates with the
    # system CAs in alpine/git): the old in-cluster plaintext URL put
    # the PAT on the wire in cleartext.
    URL="https://git.${DOMAIN_0}/$${VAULT_OWNER}/$${VAULT_REPO}.git"
    AUTH="Authorization: Basic $$(printf '%s' "x-access-token:$${TOKEN}" | base64 | tr -d '\n')"

    if [ -d /data/vault/.git ]; then
      echo "vault: refreshing mirror (fetch + ff-only)"
      git -c "http.extraHeader=$${AUTH}" -C /data/vault remote set-url origin "$${URL}"
      git -c "http.extraHeader=$${AUTH}" -C /data/vault fetch --prune origin
      git -c "http.extraHeader=$${AUTH}" -C /data/vault merge --ff-only origin/main
    else
      echo "vault: initial clone (clean URL, header auth)"
      git -c "http.extraHeader=$${AUTH}" clone "$${URL}" /data/vault
    fi

    # Staging subPath directory for the write-path glue mount (the glue
    # owns its own clone inside). Fresh-PVC note: the broker Deployment's
    # subPath mounts fail LOUDLY until this script has run once (vault/
    # and staging/ must exist on the volume) - deliberate: an empty read
    # mirror must not serve silently.
    mkdir -p /data/staging

    echo "vault: HEAD is $$(git -C /data/vault rev-parse --short HEAD)"
