# Clone/pull script shared by the recurring CronJob and one-off manual runs.
# - First run: full clone of vault main from Forgejo (in-cluster service URL,
#   token auth, zero DNS-split-horizon dependency).
# - Later runs: fast-forward pull only. Divergence is an error (the broker
#   must mirror merged-to-main state; unmerged desktop state stays invisible
#   by design — the topology-enforced permission model).
# NOTE: every shell dollar below is doubled. Flux post-build envsubst (strict)
# runs over this ConfigMap and would otherwise parse the script's variables
# as its own substitution variables and fail the build. The rendered output
# carries single dollars. VAULT_OWNER/VAULT_REPO come from the CronJob env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-sync-script
  namespace: broker
data:
  sync.sh: |
    #!/bin/sh
    set -eu
    TOKEN="$$(cat /secrets/forgejo-token)"
    URL="http://x-access-token:$${TOKEN}@forgejo-http.forgejo.svc.cluster.local:3000/$$${VAULT_OWNER}/$$${VAULT_REPO}.git"

    mkdir -p /data/staging

    if [ -d /data/vault/.git ]; then
      echo "vault: pulling (ff-only)"
      git -C /data/vault pull --ff-only
    else
      echo "vault: initial clone"
      git clone "$$${URL}" /data/vault
    fi

    # Staging workspace: owned by the stage_write glue sidecar, which keeps
    # its OWN clone at <PVC>/staging/vault-write. The worktree this script
    # used to pre-create here was defective from inside the broker pod —
    # a worktree shares the main clone's .git, and that path is only
    # reachable through the read-only /vault mount (plus the gitdir
    # pointer records sync-pod paths, not broker-pod paths). Deregister
    # it and drop the stale pointer file, idempotently.
    rm -rf /data/vault/.git/worktrees/staging
    rm -f /data/staging/.git

    echo "vault: HEAD is $$(git -C /data/vault rev-parse --short HEAD)"
