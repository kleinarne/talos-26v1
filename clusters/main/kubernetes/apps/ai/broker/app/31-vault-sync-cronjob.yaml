# Vault sync - recurring mirror refresh: fetch + ff-only merge of Core
# main. The broker mounts the result read-only, so this CronJob is the
# only writer of /vault content via git.
#
# Schedule tightened hourly :23 -> */10 (2026-10-31): the old cadence
# left the read path stale for up to an hour after a ratify (merge).
# Recurring runs are seconds-long fetch+ff, so the nightly backup window
# (00:25-01:01) is not a concern for them; the one long action, the
# initial clone, stays a deliberate manual bootstrap step:
#   kubectl create job --from=cronjob/vault-sync -n broker vault-sync-manual
# Run exactly that once after the namespace reinstall (fresh PVC), before
# relying on the read port.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-sync
  namespace: broker
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: vault-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: git-sync
              image: alpine/git:2.47.2
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: VAULT_OWNER
                  value: "kleinar"
                - name: VAULT_REPO
                  # Explicit target: the fresh Core repo (kleinar/pkm).
                  value: "pkm"
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: vault-data
                  mountPath: /data
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              command: ["/bin/sh", "/scripts/sync.sh"]
          volumes:
            - name: vault-data
              persistentVolumeClaim:
                claimName: vault-clone
            - name: secrets
              secret:
                secretName: broker-secrets
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap:
                name: vault-sync-script
          nodeSelector: {}
