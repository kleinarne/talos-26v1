# park glue - the broker's write path (write port, :8001). One MCP tool:
# park = push + ensure-open-PR. Deliberately a ConfigMap, not an image
# rebuild: the script rides the already-built, digest-pinned broker image
# (mcpo + pinned mcp SDK are already inside; the glue is a FastMCP stdio
# server and adds ZERO new dependencies), and code-in-repo goes through
# the same review-before-push + pre-merge gates as every other broker
# artifact.
#
# Park semantics (amends the park-mechanics decision; operational spec):
# - park is ONE broker action with idempotent convergence semantics;
#   transact-atomicity is impossible across git + API, so the load-bearing
#   spec is failure semantics + idempotency:
#     success <=> branch pushed AND open PR exists
#     failure is loud, never a silent half-park; retries converge
# - a park without branch= creates a fresh dated park/<stamp> branch;
#   re-parking the same branch pushes new commits onto it (ff only) and
#   ENSURES the open PR (create-if-none-exists), so a retry after a
#   half-park (pushed but PR-create failed) converges instead of
#   duplicating
# - rejected PRs are never reopened: a re-park of the same branch opens a
#   fresh PR (rejection history lives in the closed PRs); if the forge
#   refuses a second PR for the branch, the error says so and the remedy
#   is a fresh branch
# - the glue NEVER merges and NEVER pushes main; ratify (approve + merge)
#   is a human act
#
# Auth: the token is read from the mounted secret and passed per
# invocation - to git as an Authorization header via GIT_CONFIG env vars
# (NOT argv: /proc/<pid>/cmdline is world-readable, environ is same-uid;
# clean remote URL always), to the Forgejo REST API in the Authorization
# header. It is never written to any file, config, or remote URL.
#
# Transport: HTTPS to https://git.arneklein.net - resolved IN-CLUSTER:
# the Deployment's hostAliases pin the name to the nginx-internal LB
# VIP (pod->internal VIP->nginx-internal->forgejo-http ClusterIP; pods
# cannot hairpin out to the external LB and back), and nginx-internal
# serves the *.arneklein.net wildcard LE cert, so TLS validates against
# the system CAs for git and urllib alike. The literal hostname (no $)
# keeps this ConfigMap envsubst-safe. The old in-cluster plaintext
# forgejo-http:3000 endpoint put the PAT on the wire in cleartext.
#
# Envsubst note: strict post-build envsubst parses every dollar in the
# rendered set. This script intentionally contains ZERO dollar signs
# (re-verified).
apiVersion: v1
kind: ConfigMap
metadata:
  name: stage-glue-script
  namespace: broker
data:
  stage_server.py: |
    """park: git staging-write glue for the broker write path (:8001).

    ONE MCP tool. Park = push + ensure-open-PR, one broker action with
    idempotent convergence semantics:

      - success means the branch is pushed AND an open PR exists for it;
      - failure is loud, never a silent half-park; retries converge
        (re-park the same branch: new commits push onto it ff-only and
        the PR is ensured, not duplicated);
      - rejected PRs are never reopened - a re-park of the same branch
        opens a fresh PR; rejection history lives in the closed PRs.

    It NEVER merges and NEVER pushes main. Ratify (approve + merge) is a
    human act.

    Layout:
      /staging               RW PVC subPath, this sidecar's workspace
      /staging/vault-write   dedicated git clone owned by this glue
      /secrets/...           Forgejo token file, read at runtime only

    Auth: the token is read from the mounted secret and passed per
    invocation - to git as an Authorization header (git -c
    http.extraHeader, clean remote URL always), to the Forgejo REST API
    in the Authorization header. It is never written to any file,
    config, or remote URL.
    """

    import base64
    import fcntl
    import json
    import os
    import subprocess
    import sys
    import urllib.error
    import urllib.request
    from datetime import datetime, timezone
    from pathlib import PurePosixPath

    from mcp.server.fastmcp import FastMCP
    from pydantic import BaseModel, Field

    STAGING = os.environ.get("STAGING_DIR", "/staging")
    CLONE_DIR = os.path.join(STAGING, "vault-write")
    LOCK_FILE = os.path.join(STAGING, ".stage.lock")
    TOKEN_FILE = os.environ.get("STAGE_TOKEN_FILE", "/secrets/forgejo-pkm-stage-token")
    FORGEJO_URL = os.environ.get(
        "FORGEJO_URL", "https://git.arneklein.net"
    )
    WEB_URL = os.environ.get("WEB_URL", "https://git.arneklein.net")
    OWNER = os.environ.get("VAULT_OWNER", "kleinar")
    REPO = os.environ.get("VAULT_REPO", "pkm")
    BRANCH_PREFIX = os.environ.get("STAGE_BRANCH_PREFIX", "park")
    BASE_BRANCH = os.environ.get("STAGE_BASE_BRANCH", "main")
    GIT_NAME = os.environ.get("STAGE_GIT_NAME", "broker park")
    GIT_EMAIL = os.environ.get("STAGE_GIT_EMAIL", "park@broker.svc")

    MAX_FILES = 20
    MAX_FILE_BYTES = 262144
    MAX_TOTAL_BYTES = 1048576
    API_TIMEOUT = 30
    PR_PAGE_SIZE = 50
    PR_PAGE_CAP = 100
    FORBIDDEN_ROOTS = frozenset([".git", ".obsidian", ".trash", ".stversions"])


    def log(msg):
        print(msg, file=sys.stderr, flush=True)

    def read_token():
        with open(TOKEN_FILE, "r", encoding="utf-8") as fh:
            tok = fh.read().strip()
        if not tok:
            raise RuntimeError("empty Forgejo token file: " + TOKEN_FILE)
        return tok

    def git(token, args, cwd=None, check=True):
        """Run git with per-invocation auth header and identity. No config
        files. The auth header rides GIT_CONFIG env (git config -c via
        argv would expose the PAT through world-readable /proc cmdline);
        TLS is verified against the system CAs (HTTPS endpoint only)."""
        header = "Authorization: Basic " + base64.b64encode(
            ("x-access-token:" + token).encode("utf-8")
        ).decode("ascii")
        env = dict(os.environ)
        env["GIT_CONFIG_NOSYSTEM"] = "1"
        env["GIT_CONFIG_GLOBAL"] = "/dev/null"
        env["GIT_TERMINAL_PROMPT"] = "0"
        env["GIT_CONFIG_COUNT"] = "1"
        env["GIT_CONFIG_KEY_0"] = "http.extraHeader"
        env["GIT_CONFIG_VALUE_0"] = header
        cmd = [
            "git",
            "-c", "user.name=" + GIT_NAME,
            "-c", "user.email=" + GIT_EMAIL,
        ] + list(args)
        proc = subprocess.run(
            cmd,
            cwd=cwd or CLONE_DIR,
            env=env,
            capture_output=True,
            text=True,
        )
        if check and proc.returncode != 0:
            err = proc.stderr.replace(token, "[redacted]")
            raise RuntimeError(
                "git " + args[0] + " failed (rc=" + str(proc.returncode) + "): "
                + err.strip()[-2000:]
            )
        return proc

    def git_out(token, args, cwd=None):
        return git(token, args, cwd=cwd, check=True).stdout

    def ensure_clone(token):
        if os.path.isdir(os.path.join(CLONE_DIR, ".git")):
            return
        url = FORGEJO_URL + "/" + OWNER + "/" + REPO + ".git"
        log("park glue: initial clone of " + OWNER + "/" + REPO)
        proc = git(token, ["clone", url, CLONE_DIR], cwd=STAGING)
        if proc.returncode != 0:
            err = proc.stderr.replace(token, "[redacted]")
            raise RuntimeError("git clone failed: " + err.strip()[-2000:])

    def validate_path(path):
        if not path or len(path) > 200:
            raise ValueError("path must be 1-200 characters")
        if path.startswith("/") or "\\" in path:
            raise ValueError("path must be a relative POSIX path: " + path[:80])
        p = PurePosixPath(path)
        parts = p.parts
        if not parts or ".." in parts:
            raise ValueError("path must not traverse upward: " + path[:80])
        if not path.endswith(".md"):
            raise ValueError("only .md note paths are parkable: " + path[:80])
        if parts[0] in FORBIDDEN_ROOTS or ".git" in parts:
            raise ValueError("path root is not parkable: " + path[:80])
        return p.as_posix()

    def validate_branch(branch):
        """Re-park target must be a git-valid name under the park prefix."""
        if not branch or len(branch) > 100:
            raise ValueError("branch must be 1-100 characters")
        if not branch.startswith(BRANCH_PREFIX + "/"):
            raise ValueError(
                "branch must be under " + BRANCH_PREFIX + "/ : " + branch[:80]
            )
        if "@{" in branch:
            raise ValueError("branch must not contain @{ : " + branch[:80])
        for part in branch.split("/"):
            if (
                not part
                or part.startswith(".")
                or ".." in part
                or part.endswith(".lock")
                or any(c in part for c in " ~^:?*[\\")
            ):
                raise ValueError("invalid git branch name: " + branch[:80])
        return branch

    def pick_branch(token):
        stamp = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")
        branch = BRANCH_PREFIX + "/" + stamp
        n = 2
        while git(
            token,
            ["show-ref", "--verify", "--quiet", "refs/heads/" + branch],
            check=False,
        ).returncode == 0:
            branch = BRANCH_PREFIX + "/" + stamp + "-" + str(n)
            n += 1
            if n > 99:
                raise RuntimeError("branch collision loop; refusing")
        return branch

    def api(token, method, path, body=None):
        """Forgejo REST call, token in the Authorization header, never in URLs."""
        url = FORGEJO_URL + "/api/v1" + path
        headers = {
            "Accept": "application/json",
            "Authorization": "token " + token,
        }
        data = None
        if body is not None:
            data = json.dumps(body).encode("utf-8")
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=API_TIMEOUT) as resp:
                raw = resp.read().decode("utf-8", "replace") or "{}"
                return resp.status, json.loads(raw)
        except urllib.error.HTTPError as err:
            raw = err.read().decode("utf-8", "replace") or "{}"
            try:
                parsed = json.loads(raw)
            except ValueError:
                parsed = {"raw": raw[-1000:]}
            return err.code, parsed
        except urllib.error.URLError as err:
            raise RuntimeError(
                "forgejo api unreachable ("
                + method + " " + path + "): " + str(err.reason)
            )

    def open_pr_for(token, branch):
        """Find the open PR for a branch, paginating (a missed hit would
        wedge ensure-open-PR into a permanent 409 loop)."""
        page = 1
        while True:
            path = ("/repos/" + OWNER + "/" + REPO
                    + "/pulls?state=open&limit=" + str(PR_PAGE_SIZE)
                    + "&page=" + str(page))
            status, payload = api(token, "GET", path)
            if status != 200:
                raise RuntimeError(
                    "listing open PRs failed (HTTP " + str(status) + "): "
                    + json.dumps(payload)[:500]
                )
            items = payload if isinstance(payload, list) else []
            for pr in items:
                head = (pr.get("head") or {}).get("ref") or ""
                base = (pr.get("base") or {}).get("ref") or ""
                if head == branch and base == BASE_BRANCH:
                    return pr
            if len(items) < PR_PAGE_SIZE:
                return None
            if page >= PR_PAGE_CAP:
                raise RuntimeError(
                    "open PR listing did not converge within "
                    + str(PR_PAGE_CAP) + " pages; refusing"
                )
            page += 1

    def pr_summary(payload):
        num = payload.get("number")
        url = payload.get("html_url") or (
            WEB_URL + "/" + OWNER + "/" + REPO + "/pulls/" + str(num)
        )
        return num, url

    def ensure_open_pr(token, branch, title, body_text):
        """Create-if-none-exists. Returns (pr, created)."""
        existing = open_pr_for(token, branch)
        if existing is not None:
            return existing, False
        status, payload = api(
            token,
            "POST",
            "/repos/" + OWNER + "/" + REPO + "/pulls",
            {"title": title, "body": body_text, "head": branch, "base": BASE_BRANCH},
        )
        if status == 201:
            return payload, True
        if status in (409, 422):
            raced = open_pr_for(token, branch)
            if raced is not None:
                return raced, False
            raise RuntimeError(
                "PR create refused (HTTP " + str(status) + ") and no open PR for "
                + branch + " - if a PR for this branch already exists in a closed "
                "state the forge refuses a second one; park a FRESH branch instead. "
                "Detail: " + json.dumps(payload)[:500]
            )
        raise RuntimeError(
            "PR create failed (HTTP " + str(status) + "): "
            + json.dumps(payload)[:500]
        )

    def pr_title_of(message, title):
        t = (title or "").strip()
        if t:
            return t[:120]
        first = message.strip().splitlines()[0] if message.strip() else "park"
        return ("Park: " + first)[:120]

    def pr_body_of(message, sha, files):
        lines = [
            "Parked by the broker write path (push + ensure-open-PR).",
            "Commit: " + sha,
            "Files:",
        ]
        lines.extend("- " + f for f in files)
        lines.append("")
        lines.append("Ratify = human review and merge. The broker never merges.")
        return "\n".join(lines)

    def park_impl(files, message, branch, title):
        if not files or len(files) > MAX_FILES:
            raise ValueError("files: provide 1 to " + str(MAX_FILES) + " entries")
        msg = (message or "").strip()
        if len(msg) < 3 or len(msg) > 500:
            raise ValueError("message must be 3-500 characters")

        cleaned = []
        seen = set()
        total = 0
        for f in files:
            p = validate_path(f.path)
            if p in seen:
                raise ValueError("duplicate path: " + p)
            seen.add(p)
            if "\x00" in f.content:
                raise ValueError("NUL byte in content of " + p)
            data = f.content.encode("utf-8")
            if len(data) > MAX_FILE_BYTES:
                raise ValueError("file exceeds budget (256 KiB): " + p)
            total += len(data)
            if total > MAX_TOTAL_BYTES:
                raise ValueError("call exceeds total budget (1 MiB)")
            cleaned.append((p, f.content))

        if branch:
            branch = validate_branch(branch)
        else:
            branch = None

        token = read_token()
        os.makedirs(STAGING, exist_ok=True)
        lock = open(LOCK_FILE, "a+")
        try:
            fcntl.flock(lock, fcntl.LOCK_EX)
            ensure_clone(token)
            git(token, ["fetch", "--prune", "origin"])
            base = git_out(token, ["rev-parse", "--short", "origin/" + BASE_BRANCH]).strip()

            if branch is None:
                branch = pick_branch(token)
                on_origin = False
            else:
                on_origin = git(
                    token,
                    ["show-ref", "--verify", "--quiet", "refs/remotes/origin/" + branch],
                    check=False,
                ).returncode == 0
            start = "origin/" + branch if on_origin else "origin/" + BASE_BRANCH
            git(token, ["checkout", "-f", "-B", branch, start])
            git(token, ["clean", "-fd"])

            for p, content in cleaned:
                full = os.path.join(CLONE_DIR, p)
                if os.path.isdir(full):
                    raise ValueError("path is a directory: " + p)
                parent = os.path.dirname(full)
                if parent:
                    os.makedirs(parent, exist_ok=True)
                with open(full, "w", encoding="utf-8", newline="") as fh:
                    fh.write(content)

            add_args = ["add", "--"] + [p for p, _ in cleaned]
            git(token, add_args)
            staged = [
                ln for ln in git_out(token, ["diff", "--cached", "--name-only"]).splitlines()
                if ln.strip()
            ]

            if not staged:
                if not on_origin:
                    # Fresh (or local-only) branch with no delta: nothing
                    # pushed, nothing reviewable - leave no residue.
                    git(token, ["checkout", "-f", "--detach", "origin/" + BASE_BRANCH])
                    git(token, ["branch", "-D", branch])
                    return {
                        "status": "no-change",
                        "detail": "content matches origin/" + BASE_BRANCH
                                  + "; nothing parked",
                        "files": [p for p, _ in cleaned],
                    }
                # Existing origin branch, no new commits: this is a
                # convergence retry or a content no-op - fall through to
                # ensure-open-PR.
                sha = git_out(token, ["rev-parse", "--short", "origin/" + branch]).strip()
                pushed = False
            else:
                git(token, ["commit", "-m", msg])
                sha = git_out(token, ["rev-parse", "--short", "HEAD"]).strip()
                if not branch.startswith(BRANCH_PREFIX + "/"):
                    raise RuntimeError("branch guard violated")
                try:
                    git(token, ["push", "origin",
                                "refs/heads/" + branch + ":refs/heads/" + branch])
                except RuntimeError as err:
                    # Ambiguous push: a transport failure after the server
                    # received the ref looks identical to one before it.
                    # Reconcile against the remote (ls-remote) instead of
                    # guessing: ref landed at this commit -> the push
                    # succeeded, park continues, no half-park report;
                    # ref absent -> fail naming the branch machine-readably
                    # (RETRY_BRANCH=) so even a caller that cannot parse
                    # prose lands the retry on the SAME branch instead of
                    # minting a duplicate park on a fresh dated branch.
                    sha_full = git_out(token, ["rev-parse", "HEAD"]).strip()
                    probe = git(
                        token,
                        ["ls-remote", "origin", "refs/heads/" + branch],
                        check=False,
                    )
                    remote_line = probe.stdout.strip()
                    if probe.returncode != 0:
                        raise RuntimeError(
                            "PUSH OUTCOME AMBIGUOUS for branch " + branch
                            + " (commit " + sha + "): the push may or may not "
                            + "have landed and ls-remote could not verify "
                            + "(transport down). RETRY_BRANCH=" + branch
                            + " - retry the SAME park with branch=" + branch
                            + " - it converges either way (branch on "
                            + "origin: content matches, PR ensured; branch "
                            + "not on origin: recreated from " + BASE_BRANCH
                            + " and pushed). Do not park a fresh branch "
                            + "unless duplicate content is wanted. "
                            + "Original error: " + str(err)
                        )
                    remote_sha = remote_line.split()[0] if remote_line else ""
                    if remote_sha == sha_full:
                        git(token, ["update-ref",
                                    "refs/remotes/origin/" + branch, sha_full])
                        log("park: push outcome verified on remote for "
                            + branch + " (" + sha + ")")
                    else:
                        raise RuntimeError(
                            "PUSH FAILED for branch " + branch
                            + " (commit " + sha + "): the remote does not "
                            + "carry the ref (verified via ls-remote). "
                            + "RETRY_BRANCH=" + branch + " - retry the SAME "
                            + "park with branch=" + branch + " to recreate "
                            + "and push it. Original error: " + str(err)
                        )
                pushed = True
                log("park: pushed " + branch + " (" + sha + ", "
                    + str(len(staged)) + " files)")

            # park succeeds <=> branch pushed AND open PR exists.
            listed = staged if staged else [p for p, _ in cleaned]
            try:
                pr, created = ensure_open_pr(
                    token, branch,
                    pr_title_of(msg, title),
                    pr_body_of(msg, sha, listed),
                )
            except RuntimeError as err:
                if pushed:
                    raise RuntimeError(
                        "HALF-PARK (loud, by design): branch " + branch
                        + " pushed at " + sha + " but ensuring the open PR "
                        + "failed. Retry the SAME park with branch=" + branch
                        + " to converge: the push is then a no-op and the PR "
                        + "will be ensured. Original error: " + str(err)
                    )
                raise

            pr_num, pr_url = pr_summary(pr)
            if pushed:
                log("park: open PR #" + str(pr_num) + " ensured for " + branch)
            return {
                "status": "parked" if pushed else "converged",
                "branch": branch,
                "commit": sha,
                "pr": pr_num,
                "pr_url": pr_url,
                "pr_created": created,
                "base": base,
                "files": listed,
                "total_bytes": total,
                "next": "Ratify: a human reviews, approves and merges "
                        + pr_url + ". park never merges and never pushes "
                        + BASE_BRANCH + ".",
            }
        finally:
            fcntl.flock(lock, fcntl.LOCK_UN)
            lock.close()

    class ParkFile(BaseModel):
        path: str = Field(
            ..., description="Repo-relative note path, e.g. notes/example.md"
        )
        content: str = Field(
            ..., description="Full note content (UTF-8 text), written byte-exact"
        )

    mcp = FastMCP("stage-glue")

    @mcp.tool()
    def park(files: list[ParkFile], message: str, branch: str = "", title: str = "") -> dict:
        """Park note writes: commit .md files onto a park/* branch, push it,
        and ensure an open PR exists (create if none).

        Park is ONE action: success means the branch is pushed AND an open
        PR exists. Retries with the same branch converge instead of
        duplicating. Without branch= a fresh dated park/<stamp> branch is
        created; pass the same branch to add commits to an existing park.
        Rejected PRs are never reopened - re-parking the branch opens a
        fresh PR; if the forge refuses a second PR for the branch, the
        error says so and the remedy is a fresh branch. The tool never
        merges and never pushes main; ratify (approve + merge) is a human
        act. Paths are repo-relative .md note paths; content is written
        byte-exact. Reads are served by the OTHER broker tool server on
        port 8000; this tool has no read access to the repo.
        """
        return park_impl(files, message, (branch or "").strip(), (title or "").strip())

    if __name__ == "__main__":
        log("park glue: serving park on stdio")
        mcp.run()
