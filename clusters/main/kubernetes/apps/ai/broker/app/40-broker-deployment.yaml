# Broker - mcpo + ptdgrp in one container (stdio child), serving OpenAPI on :8000.
# Egress-only: ClusterIP service, no ingress, reachable only from Open WebUI.
# Ingress = read-only /vault mount; parks are the glue's job (write port).
#
# Repo deltas vs. the burst package (defect fixes - see PR):
# - vault + staging mounts: subPath moved onto the volumeMounts. The sync
#   CronJob clones into <PVC>/vault and stages into <PVC>/staging, so both
#   mounts need their subPath there; the package had it on the PVC volume
#   source (invalid field) and the vault mount bare (would nest the repo
#   one level down and break vault-relative link resolution).
# - $(MCPO_API_KEY) is written doubled: Flux strict post-build envsubst
#   parses every dollar in the rendered set (PR #176 incident class);
#   $$ renders to $ (PR #177 proof), then kubelet expands $(MCPO_API_KEY)
#   from the container env.
#
# stage-glue sidecar (write path): same image, second mcpo on :8001 wrapping
# the park glue (ConfigMap-mounted FastMCP server; no image rebuild).
# park = push + ensure-open-PR via the Forgejo REST API; it never merges
# and never pushes main (ratify is a human act). It never mounts /vault -
# its only repo access is its own clone on the RW /staging mount - and it
# is the ONLY container that mounts the Forgejo token (git push + PR
# create). Two separate tool servers = two separate toggles in Open WebUI,
# so write access is granted per chat, deliberately.
#
# Fresh-PVC order dependency (reinstall): the subPath mounts (vault/,
# staging/) fail LOUDLY until the first vault-sync run has created them on
# the volume. Deliberate: an empty read mirror must not serve silently.
# Bootstrap: kubectl create job --from=cronjob/vault-sync -n broker
# vault-sync-manual, then the pods come up.
#
# v0.2.0 bump (2026-10-28): v0.1.0 + git binary only - the stage-glue
# shells out to git; v0.1.0 shipped without it (Errno 2, caught live in the
# first stage_write smoke). No mcpo/ptdgrp/lock changes; license-diff gate
# not triggered. Merge ONLY after v0.2.0 is pushed to the registry -
# Recreate kills the old pod before pulling the new image.
#
# Readiness hardening (2026-10-31 review): on the READ container /docs
# only proved the mcpo wrapper was up - on a fresh PVC kubelet CREATES
# missing subPath dirs, so the old probe could mark an EMPTY mirror
# Ready and serve it silently. The READ container now uses an exec
# probe (python, already in the image) that fails until the vault mirror
# holds a checked-out commit. Bootstrap stays the documented manual
# vault-sync job run.
#
# The WRITE container (stage-glue) keeps its httpGet /docs probe
# deliberately (PR review 2026-11-01): its clone is created lazily by
# the first park, so a data-based gate there would deadlock the write
# path after a fresh PVC - glue NotReady drops the pod from the service
# on BOTH ports, the first park never arrives, the clone is never
# created. mcpo-up is the correct gate for a self-initializing path.
#
# Fresh-PVC ownership (2026-11-01 live reinstall defect): kubelet creates
# missing subPath dirs as ROOT (fsGroup only fixes the GID). The first
# sync clone succeeds into the root-owned dir, then every later git op
# as uid 1000 fails 'dubious ownership'. The fix-permissions initContainer
# chowns the subPath mounts in place BEFORE the main containers start -
# the ownership half of the fresh-PVC gate (the readyz probe is the
# emptiness half). No safe.directory anywhere - git's guard stays on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: broker
  labels:
    app: broker
spec:
  replicas: 1
  strategy:
    type: Recreate   # single writer of nothing, but avoids two pods on the PVC ro-mount during rollout
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      automountServiceAccountToken: false   # pod needs no API access
      # Forgejo over in-cluster TLS: git.<domain> is pinned to the
      # nginx-internal LB VIP so https://git.<domain> from this pod stays
      # on the node (public DNS fronts the nginx-external surface off-
      # cluster via Cloudflare - the pod path that does not work).
      # NOT a hairpin: MetalLB L2 VIP = secondary node address, and this
      # single-node cluster DNATs pod->VIP locally via Cilium kube-proxy
      # replacement (PR #175 debug pod proved TLS to the VIP works).
      # nginx-internal serves the *.<domain> wildcard LE cert, so TLS
      # validates for the pinned name. The internal ingress lives with
      # the Forgejo app (internal-ingress.yaml).
      hostAliases:
        - ip: ${NGINX_INTERNAL_IP}
          hostnames:
            - git.${DOMAIN_0}
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: vault-clone
        - name: staging
          persistentVolumeClaim:
            claimName: vault-clone
        - name: secrets
          secret:
            secretName: broker-secrets
        - name: glue
          configMap:
            name: stage-glue-script
        - name: readyz
          configMap:
            name: broker-readyz
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true          # Stage-A A19: root bypasses DAC - this is the ro-enforcement knob
        runAsUser: 1000             # node user in the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: forgejo-registry-pull
      initContainers:
        # Ownership half of the fresh-PVC gate (2026-11-01 live reinstall
        # defect): kubelet CREATES missing subPath dirs as ROOT (SetVolume-
        # Ownership sets fsGroup's GID + g+rwX, but the UID stays root).
        # The first clone succeeds into the root-owned dir (group perms
        # suffice), then EVERY later git op as uid 1000 dies with
        # 'detected dubious ownership'. NO safe.directory anywhere - git's
        # ownership guard stays fully on; this chown is the fix.
        # Convergence is order-independent: sync-first -> clone creates
        # /data/vault as 1000, kubelet finds the subPath existing, chown
        # no-ops; pod-first -> kubelet root-creates, chown fixes ownership
        # before the first sync run. chown IN PLACE only - never rm/mv a
        # live subPath bind target (running containers keep the old inode).
        - name: fix-permissions
          image: git.arneklein.net/kleinar/broker-mcp:v0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            # One-shot root for chown only - deliberate per-container
            # override of the pod-level runAsNonRoot (standard
            # fix-permissions idiom; busybox chown, zero new deps).
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            # $$-doubled: Flux strict post-build envsubst parses every
            # dollar in the rendered set (broker-args precedent, PR #178);
            # $$ collapses to $, then /bin/sh expands the command subst.
            - >-
              chown -R 1000:1000 /vault /staging 2>/dev/null || true;
              echo "fix-permissions: $$(stat -c '%u:%g' /vault) /vault, $$(stat -c '%u:%g' /staging) /staging"
          volumeMounts:
            - name: vault
              mountPath: /vault
              subPath: vault
            - name: staging
              mountPath: /staging
              subPath: staging
      containers:
        - name: broker
          image: git.arneklein.net/kleinar/broker-mcp:v0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # K8s expands $(VAR) from env into args (after Flux envsubst rendered $$ to $).
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --api-key
            - $$(MCPO_API_KEY)
            - --
            - obsidian-vault-mcp
            - --log-level        # CLI default is debug; broker runs at info (Stage-A production fact)
            - info
            - --vault
            - /vault
            - serve
          env:
            - name: MCPO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: broker-secrets
                  key: mcpo-api-key
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            exec:
              command: ["python", "/readyz/readyz.py"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: vault
              mountPath: /vault
              readOnly: true      # ptdgrp write tools fail closed at the filesystem
              subPath: vault      # repo lives at <PVC>/vault (sync clones into it)
            - name: staging
              mountPath: /staging  # RW worktree for the park glue; NOT exposed to MCP tools
              subPath: staging
            - name: tmp
              mountPath: /tmp
            - name: readyz          # READ container only: empty-mirror gate
              mountPath: /readyz
              readOnly: true
        - name: stage-glue
          image: git.arneklein.net/kleinar/broker-mcp:v0.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Same wrap pattern as the read path: mcpo on :8001 spawning a stdio
          # child. The child is the ConfigMap glue; python + the pinned mcp SDK
          # are already in the image, so no rebuild and no lock change.
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8001"
            - --api-key
            - $$(MCPO_API_KEY)
            - --
            - python
            - /glue/stage_server.py
          env:
            - name: MCPO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: broker-secrets
                  key: mcpo-api-key
            - name: VAULT_OWNER
              # Declared once: postBuild.substitute in ../ks.yaml
              value: "${VAULT_OWNER}"
            - name: VAULT_REPO
              # Declared once: postBuild.substitute in ../ks.yaml
              value: "${VAULT_REPO}"
            - name: STAGE_BRANCH_PREFIX
              value: "park"
            - name: HOME
              value: /tmp
          ports:
            - name: http-write
              containerPort: 8001
          readinessProbe:
            # mcpo-up is the correct gate for the write path: the glue's
            # clone is created lazily by the FIRST park (ensure_clone), so a
            # data-based probe here would deadlock post-reinstall (glue
            # NotReady -> no endpoints on EITHER port -> the first park never
            # arrives -> clone never created). The empty-mirror invariant is
            # a READ path property; the write path self-initializes. First
            # park after a fresh-PVC reinstall includes the initial clone
            # inline - roughly 10-30 s; the mcpo/Open WebUI request timeout
            # must tolerate that.
            httpGet:
              path: /docs
              port: http-write
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: http-write
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: staging        # RW: glue keeps its own clone at /staging/vault-write
              mountPath: /staging
              subPath: staging
            - name: secrets        # Forgejo token, runtime-read only; never on disk elsewhere
              mountPath: /secrets
              readOnly: true
            - name: glue
              mountPath: /glue
              readOnly: true
            - name: tmp
              mountPath: /tmp
