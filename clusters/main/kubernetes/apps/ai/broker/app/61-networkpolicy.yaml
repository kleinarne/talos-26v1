# 61-networkpolicy.yaml — ADR-010's "NetworkPolicy on the gateway", executed.
# Gateway :3000 ingress allowed ONLY from:
#   - the open-webui namespace (desk leg)
# REHEARSAL 2026-11-04: the cloudflared WAN ingress allow is removed
# TEMPORARILY for the block-all rehearsal. Restore immediately after the
# rehearsal verification; until then the WAN leg is dark by design.
# First policy on these pods: all other sources go dark by default.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: broker
spec:
  podSelector:
    matchLabels:
      app: broker-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
