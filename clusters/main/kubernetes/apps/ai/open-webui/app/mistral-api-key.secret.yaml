# Mistral API key — value flows from clusterenv.yaml (MISTRAL_API_KEY) via the
# clustertool-generated cluster-config ConfigMap + Flux postBuild substitution
# (house pattern: broker-secrets, forgejo-registry-pull et al.). This file
# carries a substitution token, not the secret material; match the SOPS
# treatment of the other *.secret.yaml files before merging.
apiVersion: v1
kind: Secret
metadata:
  name: mistral-api-key
  namespace: open-webui
type: Opaque
stringData:
  api-key: "${MISTRAL_API_KEY}"
