# Open WebUI — RUNBOOK step 5. Chart is VENDORED (chart/ dir, added on this
# branch from the upstream open-webui-17.0.0.tgz release asset) because the
# published helm.openwebui.com index currently carries only dev builds
# (17.0.1-dev.N, appVersion dev — tracking image, unacceptable). Chart
# templates are processed by Helm at HelmRelease reconcile time; the strict
# postBuild envsubst never touches them. Values use cluster-config postBuild
# substitution (${DOMAIN_0} via flux-entry envsubst, like every app-dir
# manifest); literal $ in annotations is $$-doubled per repo convention.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 24h
  chart:
    spec:
      chart: clusters/main/kubernetes/apps/ai/open-webui/app/chart
      sourceRef:
        kind: GitRepository
        name: cluster
        namespace: flux-system
      interval: 24h
      # Vendored chart: repackage whenever the git revision changes. The
      # default (ChartVersion) only repackages on Chart.yaml version bumps —
      # in-place chart fixes would keep serving a stale artifact (hit on
      # 2026-10-22: post-render error persisted after PR #214 merged).
      reconcileStrategy: Revision
  values:
    # Open WebUI — official Helm chart 17.0.0 (appVersion 0.12.0), VENDORED
    # from the upstream release tgz into chart/ (the published helm.openwebui.com
    # index was regenerated 2026-10-22 with dev builds only — 17.0.0 is gone from
    # the published channel; drift + rationale recorded in the mesh-broker brief).
    # Chart defaults install Ollama + Pipelines + a bundled Redis: all off here.
    # Frontier reasoning goes to the stateless Mistral API (existing criteria/tripwires).
    ollama:
      enabled: false
    ollamaUrls: []
    pipelines:
      enabled: false
    tika:
      enabled: false
    terminals:
      enabled: false

    # Single replica, in-memory websocket manager — no bundled Redis needed.
    websocket:
      enabled: true
      manager: ""
      redis:
        enabled: false

    replicaCount: 1

    image:
      repository: ghcr.io/open-webui/open-webui
      # Pinned 0.12.5 (2026-10-29 security release — upstream advises
      # updating all deployments, CVEs pending publication). Empty tag =
      # chart appVersion, which stays 0.12.0 until the chart is re-vendored;
      # no stable 0.12.5 chart exists yet (upstream chart main = 17.4.0 /
      # appVersion 0.12.4, published index still dev-build churn), so the
      # image is pinned past the vendored chart. Renovate now tracks the
      # pin for future bumps.
      tag: "0.12.5"
      pullPolicy: IfNotPresent

    persistence:
      enabled: true
      size: 2Gi
      accessModes:
        - ReadWriteOnce

    service:
      type: ClusterIP
      port: 80
      containerPort: 8080

    # LAN/WG ingress — Arne decision 2026-10-28, moved up from the post-soak
    # queue so the operability soak runs on the real (mobile-first) usage
    # surface instead of port-forward. class internal = strictly LAN/WG by
    # construction (headlamp + nextcloud precedent, reachable via WG). Only
    # nginx-external is a Cloudflare-tunnel mapping candidate — this host must
    # never be added there; no FRITZ!Box WAN forward exists for it either.
    # Authelia forward-auth gates the edge (wildcard two_factor rule since
    # PR #283). Trusted-header mode (homelab-hardening item 4) replaces OWUI's
    # own login: password sign-in is killed in trusted-header mode
    # (open-webui #32127), so authelia is the sole credential path — no
    # parallel path for a header-spoofing in-cluster foothold to bypass.
    # Break-glass while authelia is down = port-forward + set Remote-Email
    # manually (NetworkPolicy item 3b closes that later).
    ingress:
      enabled: true
      class: internal
      host: chat.${DOMAIN_0}
      annotations:
        # House pattern = headlamp (the repo's only other forward-auth
        # integration), converged 2026-10-28: in-cluster authelia verify (no
        # edge round-trip), GET verify method, response headers, ingress-shim
        # TLS (headlamp proves the shim in this cluster). One deliberate
        # deviation: headlamp ships single $ in ?rm=$request_method; here it
        # is $$-doubled — $$ is the render-verified form for this cluster
        # (broker-args precedent, PR #178: $$ collapses to $ in postBuild) and
        # it keeps the strict envsubst gate green locally (unset-var class).
        cert-manager.io/cluster-issuer: domain-0-le-prod
        cert-manager.io/private-key-rotation-policy: Always
        nginx.ingress.kubernetes.io/auth-method: GET
        nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local:9091/api/verify"
        nginx.ingress.kubernetes.io/auth-signin: "https://auth.${DOMAIN_0}?rm=$$request_method"
        nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Name,Remote-Groups,Remote-Email"
      tls: true
      existingSecret: open-webui-tls

    # Mistral connection (stateless key from a SOPS'd secret).
    # The admin UI can refine/override this; seeding it here keeps config reproducible.
    enableOpenaiApi: true
    openaiBaseApiUrl: "https://api.mistral.ai/v1"
    openaiApiKey: ""
    openaiApiKeyExistingSecret: "mistral-api-key"
    openaiApiKeyExistingSecretKey: "api-key"

    # Vendor-principle hygiene: all telemetry/analytics off (burst-check item).
    extraEnvVars:
      - name: SCARF_NO_ANALYTICS
        value: "true"
      - name: DO_NOT_TRACK
        value: "true"
      - name: ANONYMIZED_TELEMETRY
        value: "false"
      - name: ENABLE_OTEL
        value: "false"
      # Trusted-header SSO (homelab-hardening item 4): authelia forward-auth
      # injects the Remote-* headers above; OWUI consumes them instead of its
      # own login (password sign-in dies, open-webui #32127). GOTCHA: the OWUI
      # admin account email must match the lldap/authelia email, else a second
      # non-admin user is auto-created on first login.
      - name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
        value: "Remote-Email"
      - name: WEBUI_AUTH_TRUSTED_NAME_HEADER
        value: "Remote-Name"

    # NOTE: the Open WebUI container runs as root (image default). If your cluster
    # policy enforces PSS restricted on the open-webui namespace, set
    # containerSecurityContext here and test writes to /app/backend/data first:
    #
    # containerSecurityContext:
    #   runAsNonRoot: true
    #   runAsUser: 1000
    #   runAsGroup: 1000
    #   allowPrivilegeEscalation: false
    #   capabilities:
    #     drop: ["ALL"]
    #
    # Default for the burst: leave the namespace PSS labels at your cluster's
    # baseline (fit-test pods only triggered a warning, not an enforcement).
