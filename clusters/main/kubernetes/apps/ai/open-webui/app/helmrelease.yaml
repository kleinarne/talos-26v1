# Open WebUI — RUNBOOK step 5. Chart is VENDORED (chart/ dir, added on this
# branch from the upstream open-webui-17.0.0.tgz release asset) because the
# published helm.openwebui.com index currently carries only dev builds
# (17.0.1-dev.N, appVersion dev — tracking image, unacceptable). Chart
# templates are processed by Helm at HelmRelease reconcile time; the strict
# postBuild envsubst never touches them. The values below are free of
# substitution-variable syntax (envsubst-clean).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 24h
  chart:
    spec:
      chart: clusters/main/kubernetes/apps/ai/open-webui/app/chart
      sourceRef:
        kind: GitRepository
        name: cluster
        namespace: flux-system
      interval: 24h
  values:
    # Open WebUI — official Helm chart 17.0.0 (appVersion 0.12.0), VENDORED
    # from the upstream release tgz into chart/ (the published helm.openwebui.com
    # index was regenerated 2026-10-22 with dev builds only — 17.0.0 is gone from
    # the published channel; drift + rationale recorded in the mesh-broker brief).
    # Chart defaults install Ollama + Pipelines + a bundled Redis: all off here.
    # Frontier reasoning goes to the stateless Mistral API (existing criteria/tripwires).
    ollama:
      enabled: false
    ollamaUrls: []
    pipelines:
      enabled: false
    tika:
      enabled: false
    terminals:
      enabled: false
    
    # Single replica, in-memory websocket manager — no bundled Redis needed.
    websocket:
      enabled: true
      manager: ""
      redis:
        enabled: false
    
    replicaCount: 1
    
    image:
      repository: ghcr.io/open-webui/open-webui
      # Empty tag = chart appVersion (0.12.0 at chart 17.0.0). Renovate-pinnable.
      tag: ""
      pullPolicy: IfNotPresent
    
    persistence:
      enabled: true
      size: 2Gi
      accessModes:
        - ReadWriteOnce
    
    service:
      type: ClusterIP
      port: 80
      containerPort: 8080
    
    # Ingress stays OFF for the burst — access via kubectl port-forward.
    # LAN ingress for the UI is a deliberate residue, decided after the soak.
    ingress:
      enabled: false
    
    # Mistral connection (stateless key from a SOPS'd secret).
    # The admin UI can refine/override this; seeding it here keeps config reproducible.
    enableOpenaiApi: true
    openaiBaseApiUrl: "https://api.mistral.ai/v1"
    openaiApiKey: ""
    openaiApiKeyExistingSecret: "mistral-api-key"
    openaiApiKeyExistingSecretKey: "api-key"
    
    # Vendor-principle hygiene: all telemetry/analytics off (burst-check item).
    extraEnvVars:
      - name: SCARF_NO_ANALYTICS
        value: "true"
      - name: DO_NOT_TRACK
        value: "true"
      - name: ANONYMIZED_TELEMETRY
        value: "false"
      - name: ENABLE_OTEL
        value: "false"
    
    # NOTE: the Open WebUI container runs as root (image default). If your cluster
    # policy enforces PSS restricted on the open-webui namespace, set
    # containerSecurityContext here and test writes to /app/backend/data first:
    #
    # containerSecurityContext:
    #   runAsNonRoot: true
    #   runAsUser: 1000
    #   runAsGroup: 1000
    #   allowPrivilegeEscalation: false
    #   capabilities:
    #     drop: ["ALL"]
    #
    # Default for the burst: leave the namespace PSS labels at your cluster's
    # baseline (fit-test pods only triggered a warning, not an enforcement).
