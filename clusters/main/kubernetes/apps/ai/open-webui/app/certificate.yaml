---
# TLS for chat.DOMAIN_0 — explicit Certificate because the vendored open-webui
# chart has no cert-manager integration (TC apps get one generated by their
# chart; this app does not). Same ClusterIssuer as every other app in the repo
# (domain-0-le-prod, ACME DNS-01 via Cloudflare — no port-80/443 exposure
# required, matches the LAN/WG-only posture of this ingress). Secret name
# matches ingress.existingSecret in the HelmRelease.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: open-webui-tls
  namespace: open-webui
spec:
  secretName: open-webui-tls
  issuerRef:
    name: domain-0-le-prod
    kind: ClusterIssuer
  dnsNames:
    - chat.${DOMAIN_0}
