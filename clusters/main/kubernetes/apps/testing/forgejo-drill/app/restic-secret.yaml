---
# Same restic repo (Garage, forgejo prefix) as the backup source,
# duplicated into the drill namespace for the restore mover.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-drill-restic
  namespace: forgejo-drill
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:${GARAGE_S3_URL}/${GARAGE_S3_BUCKET}/forgejo
  RESTIC_PASSWORD: ${GARAGE_S3_ENCRYPTIONKEY}
  AWS_ACCESS_KEY_ID: ${GARAGE_S3_ACCESSKEY}
  AWS_SECRET_ACCESS_KEY: ${GARAGE_S3_SECRETKEY}
