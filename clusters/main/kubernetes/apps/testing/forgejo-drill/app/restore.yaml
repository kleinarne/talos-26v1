---
# Drill 2 (content re-drill): one-shot restore of the LATEST nightly backup.
# Drill 1 (2026-10-11, git history PRs #144-#147) validated the restore path
# against an empty instance; this drill restores a snapshot that covers real
# repo content, to close the content-fidelity debt in the recovery doc
# (clusters/main/kubernetes/apps/productivity/forgejo/docs/forgejo-recovery.md).
# Without destinationPVC and with copyMethod: Snapshot, VolSync restores into
# a scratch volume, snapshots it, and reports the resulting VolumeSnapshot in
# .status.latestImage — NO PVC is left behind. The snapshot is consumed by
# pvc.yaml (PVC with dataSource), added in the phase-2 commit once the
# snapshot name is known. Copy of the repo Secret lives in this namespace
# (restic-secret.yaml).
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: forgejo-drill-restore
  namespace: forgejo-drill
spec:
  # Manual trigger: a sync fires whenever this VALUE changes. This object is
  # brand-new (drill 1's namespace was torn down by #148), so the first value
  # fires the sync. A failed manual sync does NOT retry itself — bump the
  # string to re-fire (drill 1 lesson: restore-once -> restore-once-2).
  trigger:
    manual: drill2-restore-once
  restic:
    repository: forgejo-drill-restic
    # Required when destinationPVC is not set: VolSync errors with
    # "accessModes must be provided when destinationPVC is not"
    # (drill 1 lesson, PR #145).
    accessModes:
      - ReadWriteOnce
    copyMethod: Snapshot
    capacity: 10Gi
    storageClassName: longhorn
    cacheStorageClassName: longhorn
    volumeSnapshotClassName: longhorn-snapshot-vsc
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
