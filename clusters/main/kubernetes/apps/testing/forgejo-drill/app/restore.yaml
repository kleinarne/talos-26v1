---
# One-shot restore of the latest Forgejo backup snapshot.
# Without destinationPVC and with copyMethod: Snapshot, VolSync restores into
# a scratch volume, snapshots it, and reports the resulting VolumeSnapshot in
# .status.latestImage — NO PVC is left behind. The snapshot is consumed by
# pvc.yaml (PVC with dataSource). Copy of the repo Secret lives in this
# namespace (restic-secret.yaml).
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: forgejo-drill-restore
  namespace: forgejo-drill
spec:
  # Manual trigger: a sync fires whenever this VALUE changes. The first
  # attempt (restore-once, 2026-10-11) failed spec validation; bumping the
  # string re-fires the sync — a failed manual sync does NOT retry itself.
  trigger:
    manual: restore-once-2
  restic:
    repository: forgejo-drill-restic
    # Required when destinationPVC is not set: VolSync errors with
    # "accessModes must be provided when destinationPVC is not".
    accessModes:
      - ReadWriteOnce
    copyMethod: Snapshot
    capacity: 10Gi
    storageClassName: longhorn
    cacheStorageClassName: longhorn
    volumeSnapshotClassName: longhorn-snapshot-vsc
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
