---
# Throwaway Forgejo instance for the drill-2 content re-drill.
# Same chart version as production (17.2.0 / Forgejo 15.0.9) so the restored
# SQLite schema is not migrated. Pointed at the PVC that pvc.yaml provisions
# from the restore snapshot; the live instance in the forgejo namespace is
# not touched.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-drill
  namespace: forgejo-drill
spec:
  interval: 15m
  chart:
    spec:
      chart: forgejo
      version: 17.2.0
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 2
  driftDetection:
    mode: warn
  # The drill PVC appears asynchronously (Longhorn provisions it from the
  # VolumeSnapshot via dataSource). helm's --wait must not gate the install
  # on pod readiness, or it burns the 20m timeout (x3 retries) waiting for
  # a PVC that does not exist yet (drill-1 lesson, PR #146). Do not remove.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    strategy:
      type: Recreate
    persistence:
      enabled: true
      # Chart MUST NOT create its own PVC: use the one pvc.yaml provisions
      # from the VolumeSnapshot reported by the ReplicationDestination.
      create: false
      claimName: forgejo-drill-restore
    gitea:
      admin:
        # Drill-1 lesson (PR #148): the chart seeds a default `gitea_admin`
        # whenever gitea.admin isn't overridden — and passwordMode:
        # keepUpdated would reset it on every pod recreation. Empty username
        # + no existingSecret → no admin is seeded. Verified against chart
        # 17.2.0: zero GITEA_ADMIN env vars in the render. Login must work
        # with the restored PROD credentials.
        username: ""
      config:
        server:
          DOMAIN: localhost
          ROOT_URL: http://localhost:3000/
        database:
          DB_TYPE: sqlite3
        service:
          DISABLE_REGISTRATION: true
