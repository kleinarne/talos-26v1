---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: blocky
spec:
  interval: 15m
  chart:
    spec:
      chart: blocky
      version: 22.25.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ## set stopAll to "true" if you do not want to use blocky
    # and/or disable its service
    global:
      stopAll: false
    service:
      dns:
        externalTrafficPolicy: Local
        loadBalancerIP: ${BLOCKY_IP}
        type: LoadBalancer
        integrations:
          metallb:
            enabled: true
    # git.<domain> is an Ingress host on BOTH ingress classes - external
    # (forgejo helm-release) and internal (forgejo internal-ingress.yaml,
    # deliberate: the broker in-cluster TLS write path needs it) - so
    # the k8s-gateway below answers the name with BOTH LB VIPs,
    # round-robin. Only the external VIP carries the nginx TCP-22 proxy
    # to forgejo-ssh (values.tcp), so an SSH client that drew the
    # internal VIP sent its SYN into a silent drop: ~127s TCP timeout,
    # observed 2026-11-04 (the "bitwarden popup delay" workstation
    # incident). customDNS outranks the k8s-gateway for the exact host,
    # pinning the name to the VIP that serves both https and :22.
    # Broker pods are unaffected - their hostAliases pin the name
    # directly (pods bypass DNS). CLEANUP: when the internal ingress
    # host is renamed to a dedicated internal name, drop this pin.
    customDNS:
      mapping:
        - domain: "git.${DOMAIN_0}"
          dnsserver: ${NGINX_EXTERNAL_IP}

    k8sgateway:
      # -- list of processed domains
      domains:
      - domain: "${DOMAIN_0}"
        # -- Optional configuration option for DNS01 challenge that will redirect all acme
        # challenge requests to external cloud domain (e.g. managed by cert-manager)
        # See: https://cert-manager.io/docs/configuration/acme/dns01/
        dnsChallenge:
          enabled: false
          domain: dns01.clouddns.com

      forward:
        enabled: false
        primary: tls://1.1.1.1
        secondary: tls://1.0.0.1
        options:
          - name: tls_servername
            value: cloudflare-dns.com

    # CANNOT be defined in above yaml section
    queryLog:
      # optional one of: mysql, postgresql, csv, csv-client. If empty, log to console only
      type: ""

    configmap:
      dashboard:
        enabled: false
      datasource:
        enabled: false

    cnpg:
      main:
        enabled: false
