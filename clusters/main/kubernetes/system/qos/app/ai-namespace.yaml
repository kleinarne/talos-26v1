apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-quota
  namespace: ai
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 6Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-defaults
  namespace: ai
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi